<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Shift at the Mini Market</title>
    <style>
      :root {
        --ink: #e6e1d3;
        --dim: #8d887a;
        --paper: #f1ebdc;
        --black: #050507;
        --font: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--black); color: var(--ink); font-family: var(--font); overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      /* HUD: night top-left, time top-right. Quiet by design; the wall clock is the real one. */
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #hud .corner { position: absolute; top: 18px; font-size: 15px; letter-spacing: 0.04em; color: var(--dim); text-shadow: 0 1px 2px #000; }
      #hud-night { left: 22px; }
      #hud-time { right: 22px; font-variant-numeric: tabular-nums; }
      #crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(230, 225, 211, 0.6); }

      /* Overlays: start, pause, end of shift. */
      .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(5, 5, 7, 0.78); cursor: pointer; }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 44px; font-weight: 600; letter-spacing: 0.02em; color: var(--paper); }
      .overlay p { margin: 0; font-size: 16px; color: var(--dim); }
      .overlay .hint { margin-top: 26px; font-size: 13px; color: var(--dim); }
      .overlay button { margin-top: 18px; font: inherit; font-size: 15px; padding: 10px 22px; border: 1px solid var(--dim); border-radius: 4px; background: transparent; color: var(--ink); cursor: pointer; }
      .overlay button:hover, .overlay button:focus-visible { border-color: var(--paper); color: var(--paper); outline: none; }
      #fps { position: fixed; left: 22px; bottom: 16px; font-size: 12px; color: #4a4740; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="hud-night" class="corner">Night 1</div>
      <div id="hud-time" class="corner">23:00</div>
      <div id="crosshair"></div>
    </div>

    <div id="overlay-start" class="overlay">
      <h1 id="start-title">Night 1</h1>
      <p>Click to start your shift</p>
      <p class="hint">Walk with WASD, look with the mouse. Esc pauses.</p>
    </div>

    <div id="overlay-pause" class="overlay" hidden>
      <h1>Paused</h1>
      <p>Click to go back to the till</p>
    </div>

    <div id="overlay-end" class="overlay" hidden>
      <h1>06:00</h1>
      <p>Shift over. The door is unlocked.</p>
      <button id="btn-next" type="button">Next night</button>
    </div>

    <div id="fps"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
